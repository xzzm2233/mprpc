syntax = "proto3";

package mprpc;

message RpcHeader
{
  bytes  service_name = 1;
  bytes  method_name  = 2;
  uint32 args_size    = 3;
  uint64 req_id       = 4;
  int32  err_code     = 5;
  // 0   = 成功
  // 400 = 请求格式错误（header/request 解析失败）
  // 404 = service 或 method 不存在
  // 500 = 服务端内部错误（业务 SetFailed / 序列化失败）
  string err_msg      = 6;
}
